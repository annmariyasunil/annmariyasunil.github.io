  description: "Operations research PhD student at Virginia Tech: network interdiction, bilevel and stochastic optimization, distributionally robust models."
  favicon: assets/favicon.svg
  navbar:
    left:
      - text: Research
        href: research.qmd
      # Turn this on once you have two finished posts (see README):
      # - text: Writing
      #   href: writing/index.qmd
